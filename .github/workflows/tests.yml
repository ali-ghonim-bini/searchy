name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4, libadwaita and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Check the install scripts parse
        run: sh -n install.sh && sh -n uninstall.sh
      - name: Run the tests
        # The system Python is the one that can import the GTK bindings.
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -v
